<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <!-- Monogram Emblem: Medical & Aesthetic Lotus Cross -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="20" fill="#0E7C86" />
    <circle cx="40" cy="40" r="32" stroke="white" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <!-- Stylized 'L' & Serene Curve -->
    <path d="M30 24V56C30 61.5 34.5 66 40 66H56" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="56" cy="30" r="4.5" fill="#5EEAD4" />
    <path d="M48 40C52 35 58 35 60 40C62 45 56 50 48 54" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
