      Lạc's <tspan font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="22" fill="#0F172A">Beauty Center</tspan>
    </text>
    <text x="0" y="54" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.8">
